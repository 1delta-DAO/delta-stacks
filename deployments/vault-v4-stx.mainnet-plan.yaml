#    get-symbol  => "1dSTX"
#    get-decimals => u6
#
# 5. Adapters registered:
#    get-adapter-zest-v1-wstx => (some SP2DRPT...adapter-zest-v1-wstx-v4)
#    get-adapter-zest-v2-stx  => (some SP2DRPT...adapter-zest-v2-stx-v4)
#
# 6. Allocations at zero:
#    get-alloc-zest-v1 => u0
#    get-alloc-zest-v2 => u0
#
# 7. V3 migration verified:
#    v3 vault alloc-zest-v1 => u0 (all recalled)
#    v3 vault alloc-zest-v2 => u0 (all recalled)
#    v3 vault idle-bookkeeping > 0 (all capital in idle, users can withdraw)
#
# 8. Test native STX deposit:
#    Call deposit-stx with a small amount (e.g. u100000 = 0.1 STX)
#    Verify get-total-assets increases and user receives vault shares
#
# 9. Test native STX withdraw (THE FIX):
#    After deploying capital to markets via deploy-to-zest-v1/v2,
#    call withdraw-stx to verify it succeeds (no MaxStackDepthReached)
#
# 10. Verify get-vault-state reader returns full state in 1 RPC call
#
# =============================================================================
