#    SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H/vault-stx-v4/get-total-assets" \
#      -H 'Content-Type: application/json' \
#      -d '{"sender":"SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H","arguments":[]}'
