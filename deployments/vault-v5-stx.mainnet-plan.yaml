# =============================================================================
# Delta Vault V5 / STX — Mainnet Deployment Plan
# =============================================================================
#
# Deploys the v5 STX yield vault, fixing MaxStackDepthReached that affected
# both v3 and v4.
#
# v5 fix: Data-var scratch space approach.  Withdrawal math writes results
# to data vars, stack fully unwinds, then adapter contract-calls happen in
# a flat begin body with ZERO let nesting -- reaching borrow-helper.withdraw
# at depth ~4-5 (the absolute minimum).  Sync removed from withdraw path
# to save additional frames.
#
# Deployment:
#   Batch 1: Deploy new adapters + vault
#   Batch 2: Initialize vault, register adapters
#
# Pre-flight checklist
# --------------------
#   [ ] clarinet check passes (ignoring mainnet external contract warnings)
#   [ ] All vitest tests pass: npx vitest run tests/vault-stx-v5-1.test.ts (82 tests)
#   [ ] Verify deployer STX balance covers estimated costs (~5 STX total)
#   [ ] Confirm deployer address matches expected-sender below
#   [ ] CONTRACTS ARE IMMUTABLE ONCE DEPLOYED — review code one final time
#
# Usage
# -----
#   clarinet deployments apply \
#     --deployment-plan-path deployments/vault-v5-stx.mainnet-plan.yaml
#
# =============================================================================

id: 8
name: Delta Vault V5 STX mainnet deployment
network: mainnet
stacks-node: https://api.hiro.so
bitcoin-node: http://blockstack:blockstacksystem@bitcoin.blockstack.com:8332
plan:
  batches:
    # ------------------------------------------------------------------
    # Batch 1 — Deploy adapters + vault
    # ------------------------------------------------------------------
    - id: 1
      transactions:
        - transaction-type: contract-publish
          contract-name: adapter-zest-v1-wstx-v5
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          cost: 800000
          path: contracts/prod/v5/stx/adapter-zest-v1-wstx.clar
          anchor-block-only: true
          clarity-version: 3

        - transaction-type: contract-publish
          contract-name: adapter-zest-v1-wstx-thin
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          cost: 800000
          path: contracts/prod/v5/stx/adapter-zest-v1-wstx-thin.clar
          anchor-block-only: true
          clarity-version: 3

        - transaction-type: contract-publish
          contract-name: adapter-zest-v2-stx-v5
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          cost: 500000
          path: contracts/prod/v5/stx/adapter-zest-v2-stx.clar
          anchor-block-only: true
          clarity-version: 3

        - transaction-type: contract-publish
          contract-name: vault-stx-v5-1
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          cost: 2500000
          path: contracts/prod/v5/stx/vault-stx-v5-1.clar
          anchor-block-only: true
          clarity-version: 3
      epoch: '3.0'

    # ------------------------------------------------------------------
    # Batch 2 — Initialize + register adapters
    # ------------------------------------------------------------------
    - id: 2
      transactions:
        - transaction-type: contract-call
          contract-id: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H.vault-stx-v5-1
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          method: initialize
          parameters:
            - "'SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.wstx"
            - "\"1delta STX Vault v5\""
            - "\"1dSTX\""
            - "u6"
          cost: 250000

        # Register the thin adapter (holds positions, has pull/forward for withdraw)
        - transaction-type: contract-call
          contract-id: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H.vault-stx-v5-1
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          method: register-adapter-zest-v1-wstx
          parameters:
            - "'SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H.adapter-zest-v1-wstx-thin"
          cost: 250000

        - transaction-type: contract-call
          contract-id: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H.vault-stx-v5-1
          expected-sender: SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H
          method: register-adapter-zest-v2-stx
          parameters:
            - "'SP2DRPT3AA170EK5DC4T22CMSXZ6HACATPXHPAT7H.adapter-zest-v2-stx-v5"
          cost: 250000
      epoch: '3.0'

# =============================================================================
