#
# 1. get-total-assets => u0
# 2. get-base-asset => SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.wstx
# 3. get-virtual-offset => u1000000
# 4. get-name => "1delta STX Vault v5"
# 5. get-adapter-zest-v1-wstx => (some SP2DRPT...adapter-zest-v1-wstx-v5)
#    get-adapter-zest-v2-stx  => (some SP2DRPT...adapter-zest-v2-stx-v5)
# 6. Test deposit-stx + withdraw-stx with deployed capital to confirm
#    MaxStackDepthReached is resolved
#
# =============================================================================
